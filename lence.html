<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<title>Image Match Search</title>
</head>
<style>
  
body {
  font-family: sans-serif;
  padding: 20px;
}

#results {
  margin-top: 20px;
  display: grid;
  grid-template-columns: repeat(auto-fill, 200px);
  gap: 15px;
}

.card {
  border: 1px solid #ccc;
  padding: 10px;
  border-radius: 8px;
  text-align: center;
}

.card img {
  width: 100%;
  height: 150px;
  object-fit: cover;
  border-radius: 6px;
}
</style>
<body>

<h2>છબી મૅચ સર્ચ</h2>

<input type="file" id="imgInput" accept="image/*">
<button id="searchBtn">Search Image</button>

<div id="results"></div>

<script src="https://keshavsrushti1925.github.io/keshavsrushti/script.js"></script>
<script>
  const input = document.getElementById("imgInput");
const btn = document.getElementById("searchBtn");
const results = document.getElementById("results");

btn.addEventListener("click", () => {
  if (!input.files.length) {
    alert("સૌ પ્રથમ એક છબી પસંદ કરો");
    return;
  }

  const fileName = input.files[0].name.toLowerCase();

  // find matches
  const matches = PLANTS.filter(p =>
    p.image.toLowerCase().includes(fileName)
  );

  showResults(matches);
});

function showResults(list) {
  results.innerHTML = "";

  if (!list.length) {
    results.innerHTML = "<h3>❌ કોઈ મૅચ મળ્યો નથી</h3>";
    return;
  }

  list.forEach(p => {
    const c = document.createElement("div");
    c.className = "card";
    c.innerHTML = `
      <img src="${p.image}">
      <h4>${p.name}</h4>
      <p>વર્ગ: ${p.category}</p>
      <p>સંખ્યા: ${p.count}</p>
    `;
    results.appendChild(c);
  });
}

</script>

</body>
</html>
