<!DOCTYPE html>
<html>

<head>
    <title>Image Compare</title>
    <style>
        .preview {
            width: 200px;
            margin: 10px;
        }
        
        .match-box {
            padding: 10px;
            margin-top: 20px;
            border: 2px solid #333;
        }
    </style>
</head>

<body>

    <h2>User Camera Image Compare</h2>

    <input type="file" accept="image/*" id="inputImage" capture="camera">

    <br><br>
    <img id="userImg" class="preview">

    <h3>Stored Images</h3>
    <div id="storedImages">
        <img src="https://keshavsrushti1925.github.io/keshavsrushti/images/medicinal/nagol.webp" class="preview" data-info="Image 1ની માહિતી">
        <img src="https://keshavsrushti1925.github.io/keshavsrushti/images/fruitsflowers/setur.webp" class="preview" data-info="Image 2ની માહિતી">
        <img src="https://keshavsrushti1925.github.io/keshavsrushti/images/fruitsflowers/setur.webp" class="preview" data-info="Image 3ની માહિતી">
    </div>

    <div id="result" class="match-box">અહીં result આવશે…</div>

    <script>
        function compareImages(img1, img2) {
            return new Promise(resolve => {
                const c1 = document.createElement("canvas");
                const c2 = document.createElement("canvas");
                const ctx1 = c1.getContext("2d");
                const ctx2 = c2.getContext("2d");

                c1.width = c2.width = 200;
                c1.height = c2.height = 200;

                ctx1.drawImage(img1, 0, 0, 200, 200);
                ctx2.drawImage(img2, 0, 0, 200, 200);

                const d1 = ctx1.getImageData(0, 0, 200, 200).data;
                const d2 = ctx2.getImageData(0, 0, 200, 200).data;

                let diff = 0;
                for (let i = 0; i < d1.length; i += 4) {
                    if (
                        Math.abs(d1[i] - d2[i]) > 15 ||
                        Math.abs(d1[i + 1] - d2[i + 1]) > 15 ||
                        Math.abs(d1[i + 2] - d2[i + 2]) > 15
                    ) diff++;
                }

                const total = (200 * 200);
                const percent = 100 - (diff * 100 / total);
                resolve(percent);
            });
        }

        document.getElementById("inputImage").onchange = async function(e) {
            let file = e.target.files[0];
            let userImg = document.getElementById("userImg");
            userImg.src = URL.createObjectURL(file);

            await new Promise(r => setTimeout(r, 300));

            let stored = document.querySelectorAll("#storedImages img");
            let bestMatch = {
                score: 0,
                info: "મેચ મળ્યો નથી."
            };

            for (let img of stored) {
                let score = await compareImages(userImg, img);

                if (score > bestMatch.score) {
                    bestMatch = {
                        score,
                        info: img.dataset.info
                    };
                }
            }

            if (bestMatch.score > 70) {
                document.getElementById("result").innerHTML =
                    "✔ MATCH: " + bestMatch.score.toFixed(1) + "%<br><br>" +
                    "👉 " + bestMatch.info;
            } else {
                document.getElementById("result").innerHTML = "❌ કોઈ match નથી.";
            }
        };
    </script>

</body>

</html>
