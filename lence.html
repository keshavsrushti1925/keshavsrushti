  async function getFingerprint(imgBitmap) {
  const size = 128; 
  const canvas = document.createElement("canvas");
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext("2d");

  ctx.drawImage(imgBitmap, 0, 0, size, size);
  const imgData = ctx.getImageData(0, 0, size, size).data;

  const colorFP = [];
  const gray = [];

  // ---- Color + Grayscale extract ----
  for (let i = 0; i < imgData.length; i += 4) {
    const r = imgData[i];
    const g = imgData[i + 1];
    const b = imgData[i + 2];

    colorFP.push([r, g, b]);
    gray.push((r + g + b) / 3);
  }

  // ---- Texture / Edge detection (simple Sobel) ----
  const textureFP = [];
  const w = size;

  for (let y = 1; y < size - 1; y++) {
    for (let x = 1; x < size - 1; x++) {
      const i = y * w + x;

      const gx =
        -gray[i - w - 1] - 2 * gray[i - 1] - gray[i + w - 1] +
         gray[i - w + 1] + 2 * gray[i + 1] + gray[i + w + 1];

      const gy =
        -gray[i - w - 1] - 2 * gray[i - w] - gray[i - w + 1] +
         gray[i + w - 1] + 2 * gray[i + w] + gray[i + w + 1];

      const edge = Math.sqrt(gx * gx + gy * gy);
      textureFP.push(edge);
    }
  }

  return { colorFP, textureFP };
}


  function compare(fp1, fp2) {
  let colorScore = 0;
  let textureScore = 0;

  const maxColorDist = Math.sqrt(255 ** 2 * 3);

  for (let i = 0; i < fp1.colorFP.length; i++) {
    const [r1, g1, b1] = fp1.colorFP[i];
    const [r2, g2, b2] = fp2.colorFP[i];

    const diff = Math.sqrt(
      (r1 - r2) ** 2 +
      (g1 - g2) ** 2 +
      (b1 - b2) ** 2
    );

    colorScore += 1 - diff / maxColorDist;
  }

  colorScore = colorScore / fp1.colorFP.length * 100;

  // --- Texture similarity ---
  let tDiff = 0;
  for (let i = 0; i < fp1.textureFP.length; i++) {
    tDiff += Math.abs(fp1.textureFP[i] - fp2.textureFP[i]);
  }

  const maxTex = 255 * fp1.textureFP.length;
  textureScore = (1 - tDiff / maxTex) * 100;

  // Weighted average → MORE ACCURATE RESULTS
  return colorScore * 0.7 + textureScore * 0.3;
}
