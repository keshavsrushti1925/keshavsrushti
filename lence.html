<!DOCTYPE html>
<html lang="gu">

<head>
    <meta charset="UTF-8">
    <title>Plant Image Search (PLANTS array matching)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            font-family: sans-serif;
            padding: 15px;
        }
        
        video {
            width: 100%;
            height: 100%;
            background: #000;
            border-radius: 6px;
        }
        
        #preview {
            width: 100%;
            height: 100%;
            border: 1px solid #ccc;
            object-fit: cover;
        }
        
        #search {
            height: 10px;
            width: 15px;
            border-radius: 50%;
            border: solid white;
        }
        
        #results {
            margin-top: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, 200px);
            gap: 14px;
        }
        
        .card {
            border: 1px solid #ddd;
            padding: 10px;
            border-radius: 8px;
        }
        
        .thumb {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 6px;
        }
        
        .camera-wrapper {
            position: relative;
            /* parent layer */
            width: 100%;
            height: 100%;
        }
        
        #capture {
            position: absolute;
            /* overlay layer */
            bottom: 12px;
            /* niche thi space */
            left: 50%;
            transform: translateX(-50%);
            border-radius: 50%;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            background-color: red;
            border: solid white;
        }
        /* Hide default file input */
        
        #upload {
            display: none;
            position: absolute;
            /* overlay layer */
            bottom: 12px;
            /* niche thi space */
            left: 25%;
            transform: translateX(-50%);
            border-radius: 50%;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            justify-content: none;
            align-items: none;
            cursor: pointer;
            background-color: red;
            border: solid white;
        }
        /* CSS - Camera flip icon (pure CSS) */
        
        #cameraFlip {
            position: absolute;
            /* overlay layer */
            bottom: 12px;
            /* niche thi space */
            left: 75%;
            transform: translateX(-50%);
            border-radius: 50%;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            background-color: red;
            border: solid white;
        }
        /* circular arc (main ring of arrow) */
        
        #cameraFlip:before {
            content: "";
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 3px solid transparent;
            border-top-color: #fff;
            /* arc color */
            border-right-color: #fff;
            transform: rotate(-45deg);
            position: absolute;
            opacity: 0.95;
            box-sizing: border-box;
        }
        /* arrow head (triangle) */
        
        #cameraFlip:after {
            content: "";
            position: absolute;
            width: 0;
            height: 0;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-top: 9px solid #fff;
            /* arrow head color */
            /* place arrow head at end of arc */
            top: 8px;
            right: 10px;
            transform: rotate(0deg);
            opacity: 0.95;
        }
        /* small camera dot to indicate camera (optional decorative) */
        
        .icon .dot {
            width: 6px;
            height: 6px;
            background: #fff;
            border-radius: 2px;
            position: relative;
            left: -2px;
            top: 6px;
            opacity: 0.0;
            /* set 0 if you don't want dot; set 1 to show */
        }
        /* hover / active */
        
        .icon:hover {
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.35);
            background: #2a2a2a;
        }
        
        .icon:active {
            transform: translateY(0) scale(.99);
        }
    </style>
</head>

<body>



    <div style="display:flex; flex-wrap:wrap;">
        <div class="camera-wrapper">
            <video id="cam" autoplay playsinline></video>
            <input type="file" id="upload" class="icon" accept="image/*"><br>
            <button id="capture" class="icon"></button>
            <button id="cameraFlip" class="icon"></button>

        </div>


        <div class="camera-wrapper">
            <img id="preview"><br><br>
            <button id="search">Search</button>
            <span id="status" style="margin-left:10px;color:#555"></span>
        </div>
    </div>

    <canvas id="cvs" width="128" height="128" style="display:none"></canvas>

    <div id="results"></div>
    <script src="https://github.com/keshavsrushti1925/keshavsrushti/blob/main/plants.js"></script>
    <script>
        // -----------------------------------------------------------

        const cam = document.getElementById("cam");
        const upload = document.getElementById("upload");
        const preview = document.getElementById("preview");
        const cvs = document.getElementById("cvs");
        const ctx = cvs.getContext("2d");
        const resultsEl = document.getElementById("results");
        const statusEl = document.getElementById("status");
        const icon = document.getElementsByClassName("icon")
        let inputImg = null;
        let camStream = null;
        const GEMINI_API_KEY = "YOUR_GEMINI_API_KEY_HERE"; // ✏ અહીં તમારો Gemini API Key મુકવો

        async function identifyPlantWithGemini(base64Image) {
            const res = await fetch(
                "https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=" + GEMINI_API_KEY, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{
                                text: "આ છોડનું સામાન્ય નામ એક શબ્દ/લાઈન માં આપો, ફક્ત છોડનું નામ જ."
                            }, {
                                inline_data: {
                                    mime_type: "image/jpeg",
                                    data: base64Image
                                }
                            }]
                        }]
                    })
                }
            );

            const data = await res.json();
            if (!data.candidates || !data.candidates.length) {
                return null;
            }

            // API response માંથી plant name extract
            const plantName = data.candidates[0].content.parts[0].text.trim();
            return plantName;
        }

        // Image file ને base64 માં convert
        function toBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result.split(",")[1]);
                reader.onerror = err => reject(err);
            });
        }

        // ✳ Main SEARCH BUTTON updated logic
        document.getElementById("search").onclick = async() => {
            if (!inputImg) return alert("ઈમેજ Capture અથવા Upload કરો!");

            statusEl.textContent = "AI થી plant ઓળખાઈ રહ્યું છે...";

            let base64;
            const fileInput = upload.files[0];
            if (fileInput) {
                base64 = await toBase64(fileInput);
            } else {
                // capture કર્યા પછી preview.src માંથી base64 કાઢો
                base64 = preview.src.split(",")[1];
            }

            const predictedPlant = await identifyPlantWithGemini(base64);

            if (!predictedPlant) {
                statusEl.textContent = "Result: છોડ ઓળખી શકાયો નહિ – માહિતી ઉપલબ્ધ નથી.";
                return;
            }

            statusEl.textContent = "AI Result: " + predictedPlant + " — DB માં match કરી રહ્યા છીએ...";

            const plantData = PLANTS.find(p => p.name.toLowerCase() === predictedPlant.toLowerCase());

            if (plantData) {
                statusEl.textContent = "Result: " + plantData.name + " ✅";

                resultsEl.innerHTML = `
        <div class="card">
          <img src="${plantData.image}" class="thumb">
          <div><b>${plantData.name}</b></div>
          <div>Category: ${plantData.category}</div>
          <div>Count: ${plantData.count}</div>
        </div>
      `;
            } else {
                statusEl.textContent = "Result: છોડ ઓળખી શકાયો નહિ – માહિતી ઉપલબ્ધ નથી.";
                resultsEl.innerHTML = "";
            }
        };



        // Bind switch function to your flip button
        document.getElementById("cameraFlip").addEventListener("click", switchCamera);
        let currentStream;
        let useFrontCamera = false;

        async function startCamera() {
            const constraints = {
                video: {
                    facingMode: useFrontCamera ? "user" : "environment"
                }
            };

            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }

            try {
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                document.getElementById("cam").srcObject = currentStream;
            } catch (err) {
                console.error("Camera error:", err);
            }
        }

        function switchCamera() {
            useFrontCamera = !useFrontCamera;
            startCamera();
        }

        // camera start on load
        startCamera();


        /* ================ Auto Start Camera On Page Load ================ */
        window.addEventListener("load", async() => {
            try {
                camStream = await navigator.mediaDevices.getUserMedia({
                    video: true
                });
                cam.srcObject = camStream;
                alert("Camera started automatically ✅");
            } catch (err) {
                alert("Camera permission denied or error ❌", err);
            }
        });



        document.getElementById("capture").onclick = () => {
            const c = document.createElement("canvas");
            c.width = 400;
            c.height = 300;
            c.getContext("2d").drawImage(cam, 0, 0, 400, 300);
            preview.src = c.toDataURL();

            loadImg(preview.src).then(img => inputImg = img);
            document.querySelector(".camera-wrapper").style.display = "none";
        };

        /* ================ Gallery Upload ================ */
        upload.onchange = e => {
            const url = URL.createObjectURL(e.target.files[0]);
            preview.src = url;
            loadImg(url).then(img => inputImg = img);
        };

        /* ================ Helper: Load Image ================ */
        function loadImg(url) {
            return new Promise((res, rej) => {
                const img = new Image();
                img.crossOrigin = "anonymous";
                img.onload = () => res(img);
                img.onerror = e => rej(e);
                img.src = url;
            });
        }

        /* ================ aHash (8×8) ================ */
        function aHash(img) {
            const s = 8;
            ctx.drawImage(img, 0, 0, s, s);
            const data = ctx.getImageData(0, 0, s, s).data;

            let gray = [],
                sum = 0;

            for (let i = 0; i < 64; i++) {
                const r = data[i * 4],
                    g = data[i * 4 + 1],
                    b = data[i * 4 + 2];
                const v = 0.299 * r + 0.587 * g + 0.114 * b;
                gray.push(v);
                sum += v;
            }

            const avg = sum / 64;
            return gray.map(v => v >= avg ? "1" : "0").join("");
        }

        /* ================ Hamming Distance ================ */
        function hamming(a, b) {
            let d = 0;
            for (let i = 0; i < a.length; i++) {
                if (a[i] !== b[i]) d++;
            }
            return d;
        }

        /* ================ Main SEARCH BUTTON ================ */
        document.getElementById("search").onclick = async() => {
            if (!inputImg) return alert("Capture or Upload image first!");

            statusEl.textContent = "Computing user image hash...";
            const queryHash = aHash(inputImg);

            let matches = [];

            statusEl.textContent = "Comparing with PLANTS images...";

            for (let plant of PLANTS) {
                try {
                    const img = await loadImg(plant.image);
                    const hash = aHash(img);
                    const dist = hamming(queryHash, hash);

                    matches.push({
                        ...plant,
                        dist,
                    });
                } catch (err) {
                    console.log("error loading", plant.image);
                }
            }

            matches.sort((a, b) => a.dist - b.dist);

            const top5 = matches.slice(0, 5);

            resultsEl.innerHTML = "";
            statusEl.textContent = "Done.";

            top5.forEach(p => {
                const div = document.createElement("div");
                div.className = "card";

                div.innerHTML = `
      <img src="${p.image}" class="thumb">
      <div><b>${p.name}</b></div>
      <div>Category: ${p.category}</div>
      <div>Count: ${p.count}</div>
      <div>Match Score: ${p.dist}</div>
    `;
                resultsEl.appendChild(div);
            });
        };
    </script>

</body>

</html>
