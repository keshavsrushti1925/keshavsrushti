<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<title>Image Match Search</title>
</head>
<style>
  
body {
  font-family: sans-serif;
  padding: 20px;
}

#results {
  margin-top: 20px;
  display: grid;
  grid-template-columns: repeat(auto-fill, 200px);
  gap: 15px;
}

.card {
  border: 1px solid #ccc;
  padding: 10px;
  border-radius: 8px;
  text-align: center;
}

.card img {
  width: 100%;
  height: 150px;
  object-fit: cover;
  border-radius: 6px;
}
</style>
<body>

<h2>છબી મૅચ સર્ચ</h2>

<input type="file" id="imgInput" accept="image/*">
<button id="searchBtn">Search Image</button>

<div id="results"></div>

<script src="https://keshavsrushti1925.github.io/keshavsrushti/script.js"></script>
<script src="script.js"></script>

</body>
</html>
