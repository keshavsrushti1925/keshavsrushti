<!DOCTYPE html>
<html lang="gu">

<head>
    <meta charset="UTF-8">
    <title>Plant Image Search (PLANTS array matching)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            font-family: sans-serif;
            padding: 15px;
        }
        
        video {
            width: 100%;
            height: 100%;
            background: #000;
            border-radius: 6px;
        }
        
        #preview {
            width: 200px;
            height: 150px;
            border: 1px solid #ccc;
            object-fit: cover;
        }
        
        #results {
            margin-top: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, 200px);
            gap: 14px;
        }
        
        .card {
            border: 1px solid #ddd;
            padding: 10px;
            border-radius: 8px;
        }
        
        .thumb {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 6px;
        }
        
        #capture {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            background-color: red;
            border: solid white;
        }
        .camera-wrapper {
  position: relative;  /* parent layer */
  width: 100%;
  height: 100%;
}

.camera-btn {
  position: absolute;  /* overlay layer */
  bottom: 12px;        /* niche thi space */
  left: 50%;
  transform: translateX(-50%);
  width: 60px;
  height: 60px;
  border-radius: 50%;  /* perfect round */
  background: #222;
  color: #fff;
  border: none;
  cursor: pointer;
  font-size: 14px;
  z-index: 10;         /* video thi upar */
}

    </style>
</head>

<body>



    <div style="display:flex; gap: 100px; flex-wrap:wrap;">
      <div class="camera-wrapper">
        <video id="cam" autoplay playsinline></video>
        <button id="capture" class="camera-btn"></button>
      </div>
      

        <div>
            <input type="file" id="upload" accept="image/*"><br><br>
            <img id="preview"><br><br>
            <button id="search">Search</button>
            <span id="status" style="margin-left:10px;color:#555"></span>
        </div>
    </div>

    <canvas id="cvs" width="128" height="128" style="display:none"></canvas>

    <div id="results"></div>
    <script src="plants.js"></script>
    <script>
        // -----------------------------------------------------------

        const cam = document.getElementById("cam");
        const upload = document.getElementById("upload");
        const preview = document.getElementById("preview");
        const cvs = document.getElementById("cvs");
        const ctx = cvs.getContext("2d");
        const resultsEl = document.getElementById("results");
        const statusEl = document.getElementById("status");

        let inputImg = null;
        let camStream = null;


        /* ================ Auto Start Camera On Page Load ================ */
        window.addEventListener("load", async() => {
            try {
                camStream = await navigator.mediaDevices.getUserMedia({
                    video: true
                });
                cam.srcObject = camStream;
                console.log("Camera started automatically ✅");
            } catch (err) {
                console.log("Camera permission denied or error ❌", err);
            }
        });


        document.getElementById("capture").onclick = () => {
            const c = document.createElement("canvas");
            c.width = 400;
            c.height = 300;
            c.getContext("2d").drawImage(cam, 0, 0, 400, 300);
            preview.src = c.toDataURL();

            loadImg(preview.src).then(img => inputImg = img);
        };

        /* ================ Gallery Upload ================ */
        upload.onchange = e => {
            const url = URL.createObjectURL(e.target.files[0]);
            preview.src = url;
            loadImg(url).then(img => inputImg = img);
        };

        /* ================ Helper: Load Image ================ */
        function loadImg(url) {
            return new Promise((res, rej) => {
                const img = new Image();
                img.crossOrigin = "anonymous";
                img.onload = () => res(img);
                img.onerror = e => rej(e);
                img.src = url;
            });
        }

        /* ================ aHash (8×8) ================ */
        function aHash(img) {
            const s = 8;
            ctx.drawImage(img, 0, 0, s, s);
            const data = ctx.getImageData(0, 0, s, s).data;

            let gray = [],
                sum = 0;

            for (let i = 0; i < 64; i++) {
                const r = data[i * 4],
                    g = data[i * 4 + 1],
                    b = data[i * 4 + 2];
                const v = 0.299 * r + 0.587 * g + 0.114 * b;
                gray.push(v);
                sum += v;
            }

            const avg = sum / 64;
            return gray.map(v => v >= avg ? "1" : "0").join("");
        }

        /* ================ Hamming Distance ================ */
        function hamming(a, b) {
            let d = 0;
            for (let i = 0; i < a.length; i++) {
                if (a[i] !== b[i]) d++;
            }
            return d;
        }

        /* ================ Main SEARCH BUTTON ================ */
        document.getElementById("search").onclick = async() => {
            if (!inputImg) return alert("Capture or Upload image first!");

            statusEl.textContent = "Computing user image hash...";
            const queryHash = aHash(inputImg);

            let matches = [];

            statusEl.textContent = "Comparing with PLANTS images...";

            for (let plant of PLANTS) {
                try {
                    const img = await loadImg(plant.image);
                    const hash = aHash(img);
                    const dist = hamming(queryHash, hash);

                    matches.push({
                        ...plant,
                        dist,
                    });
                } catch (err) {
                    console.log("error loading", plant.image);
                }
            }

            matches.sort((a, b) => a.dist - b.dist);

            const top5 = matches.slice(0, 5);

            resultsEl.innerHTML = "";
            statusEl.textContent = "Done.";

            top5.forEach(p => {
                const div = document.createElement("div");
                div.className = "card";

                div.innerHTML = `
      <img src="${p.image}" class="thumb">
      <div><b>${p.name}</b></div>
      <div>Category: ${p.category}</div>
      <div>Count: ${p.count}</div>
      <div>Match Score: ${p.dist}</div>
    `;
                resultsEl.appendChild(div);
            });
        };
    </script>

</body>

</html>
