<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<title>AI Image Match Search</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.16.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>

<style>
    body { font-family: sans-serif; padding: 20px; }
    #results { display: grid; grid-template-columns: repeat(auto-fill, 220px); gap: 15px; margin-top: 20px; }
    .card { border: 1px solid #ccc; padding: 10px; border-radius: 10px; text-align: center; }
    .card img { width: 100%; height: 160px; object-fit: cover; border-radius: 8px; }
</style>
</head>

<body>

<h2>🌿 AI છોડ છબી મૅચ (Near 100% Accuracy)</h2>

<input type="file" id="imgInput" accept="image/*">
<button id="searchBtn">🔍 Search</button>

<h3 id="status">Model Loading…</h3>

<div id="results"></div>

<!-- LOAD PLANTS DATA -->
<script src="plants.js"></script>

<script>
/* ------------------------------------------------------
   1. LOAD AI MODEL (MobileNetV2)
---------------------------------------------------------*/
let model;

async function loadModel() {
    document.getElementById("status").innerText = "AI Model Loading...";
    
    model = await tf.loadGraphModel(
        "https://tfhub.storage.googleapis.com/tensorflow/tfjs-model/imagenet/mobilenet_v2_140_224/classification/4/model.json",
        { fromTFHub: true }
    );
    
    document.getElementById("status").innerText = "Model Loaded ✔";
}
loadModel();


/* ------------------------------------------------------
   2. IMAGE → AI FEATURE VECTOR
---------------------------------------------------------*/
function getFeatures(img) {
    return tf.tidy(() => {
        const t = tf.browser.fromPixels(img)
            .resizeBilinear([224, 224])
            .toFloat()
            .expandDims(0);

        const features = model.predict(t).squeeze().arraySync();
        return features;
    });
}


/* ------------------------------------------------------
   3. COSINE SIMILARITY (0–100%)
---------------------------------------------------------*/
function cosineSimilarity(a, b) {
    let dot = 0, na = 0, nb = 0;

    for (let i = 0; i < a.length; i++) {
        dot += a[i] * b[i];
        na += a[i] * a[i];
        nb += b[i] * b[i];
    }

    return (dot / (Math.sqrt(na) * Math.sqrt(nb))) * 100;
}


/* ------------------------------------------------------
   4. LOAD & CACHE PLANT FEATURE VECTORS
---------------------------------------------------------*/
async function loadPlantFeature(p) {
    if (p.vector) return;

    const img = new Image();
    img.crossOrigin = "anonymous";
    img.src = p.image;

    await img.decode();
    p.vector = getFeatures(img);
}


/* ------------------------------------------------------
   5. MAIN MATCH FUNCTION
---------------------------------------------------------*/
async function matchImage(file) {
    const bmp = await createImageBitmap(file);
    const userVector = getFeatures(bmp);

    let matches = [];

    for (const p of PLANTS) {     // <-- USING plants.js DATA
        await loadPlantFeature(p);

        const score = cosineSimilarity(userVector, p.vector);

        if (score >= 70) {
            matches.push({ ...p, score });
        }
    }

    matches.sort((a, b) => b.score - a.score);
    return matches;
}


/* ------------------------------------------------------
   6. BUTTON CLICK
---------------------------------------------------------*/
document.getElementById("searchBtn").addEventListener("click", async () => {
    const file = document.getElementById("imgInput").files[0];

    if (!file) {
        alert("કૃપા કરીને છબી પસંદ કરો");
        return;
    }

    document.getElementById("status").innerText = "Matching… ⏳";

    const results = await matchImage(file);
    showResults(results);

    document.getElementById("status").innerText = "Done ✔";
});


/* ------------------------------------------------------
   7. DISPLAY RESULTS
---------------------------------------------------------*/
function showResults(list) {
    const box = document.getElementById("results");
    box.innerHTML = "";

    if (list.length === 0) {
        box.innerHTML = "<h3>❌ કોઈ મૅચ મળ્યો નથી</h3>";
        return;
    }

    list.forEach(p => {
        const div = document.createElement("div");
        div.className = "card";

        div.innerHTML = `
            <img src="${p.image}">
            <h3>${p.name}</h3>
            <p><b>${p.score.toFixed(2)}%</b> Similarity</p>
            <p>વર્ગ: ${p.category}</p>
            <p>સંખ્યા: ${p.count}</p>
        `;

        box.appendChild(div);
    });
}
</script>

</body>
</html>
